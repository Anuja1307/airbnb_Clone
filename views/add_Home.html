<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width, initial-scale=1.0">
  <title>Add home</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Add a New Home</h1>
    <form action="/host/add-home" method="post" class="space-y-4">
      <div>
        <input type="text" name="homename" placeholder="Add Home name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400"/>
      </div>
      <button type="submit" class="w-full py-2 bg-red-500 text-white rounded-full font-semibold hover:bg-red-600 transition">Submit</button>
    </form>
  </div>
</body>
</html>
